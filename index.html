<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Hub centralizado para estações, feeds e serviços de telemetria ADS-B. Acompanhe aeronaves em tempo real.">
    <meta name="theme-color" content="#0f172a">
    <title>ADS-B Feeders Portal | Leonardo Garcia</title>
    
    <!-- Favicon SVG dinâmico -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2338bdf8'><path d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z'/><circle cx='12' cy='12' r='3'/></svg>">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Background decorativo radial/glow -->
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>

    <div class="container">
        <header class="site-header">
            <div class="header-top">
                <div class="brand">
                    <div class="radar-pulse">
                        <i class="bi bi-broadcast"></i>
                    </div>
                    <div>
                        <h1>ADS-B Feeders</h1>
                        <p class="subtitle">Hub de Telemetria e Monitoramento de Aviação</p>
                    </div>
                </div>

                <div class="header-actions">
                    <button id="dark-mode-toggle" class="theme-btn" aria-label="Alternar tema de cores" title="Alternar tema">
                        <i class="bi bi-sun-fill light-icon"></i>
                        <i class="bi bi-moon-stars-fill dark-icon"></i>
                    </button>
                </div>
            </div>

            <!-- Controles de Busca e Filtros -->
            <div class="controls-wrapper">
                <div class="search-box">
                    <i class="bi bi-search search-icon"></i>
                    <input type="text" id="search-input" placeholder="Buscar por estação, serviço ou protocolo..." autocomplete="off" spellcheck="false">
                    <button id="clear-search" class="clear-btn" aria-label="Limpar busca" style="display: none;">
                        <i class="bi bi-x-circle-fill"></i>
                    </button>
                </div>

                <div class="categories-bar" id="categories-bar" role="tablist" aria-label="Filtros por categoria">
                    <button class="cat-pill active" data-category="all" role="tab" aria-selected="true">
                        <i class="bi bi-grid-fill"></i> Todos <span class="badge-count" id="count-all">0</span>
                    </button>
                    <button class="cat-pill" data-category="local" role="tab" aria-selected="false">
                        <i class="bi bi-hdd-network-fill"></i> Estação Local <span class="badge-count" id="count-local">0</span>
                    </button>
                    <button class="cat-pill" data-category="global" role="tab" aria-selected="false">
                        <i class="bi bi-globe-americas"></i> Redes Globais <span class="badge-count" id="count-global">0</span>
                    </button>
                    <button class="cat-pill" data-category="analytics" role="tab" aria-selected="false">
                        <i class="bi bi-graph-up-arrow"></i> Métricas & Stats <span class="badge-count" id="count-analytics">0</span>
                    </button>
                </div>
            </div>
        </header>

        <main id="main-content">
            <!-- Barra de Status com contador de resultados -->
            <div class="status-bar">
                <span id="results-count" class="results-text">Exibindo estações disponíveis</span>
                <span class="live-indicator"><span class="live-dot"></span> Radar Online</span>
            </div>

            <!-- Grade de Cards -->
            <div class="feeders-grid" id="feeders-list"></div>

            <!-- Empty State (quando não há resultados) -->
            <div class="empty-state" id="empty-state" style="display: none;">
                <div class="empty-icon">
                    <i class="bi bi-radar"></i>
                </div>
                <h3>Nenhuma estação encontrada</h3>
                <p>Não encontramos nenhum serviço com o termo pesquisado.</p>
                <button id="btn-reset-filters" class="reset-btn">Limpar Filtros</button>
            </div>
        </main>

        <footer class="site-footer">
            <div class="footer-content">
                <p>Hub ADS-B &bull; Mantido por <strong>Leonardo Garcia</strong></p>
                <div class="footer-links">
                    <a href="https://github.com/leosgarcia/ultrafeeder" target="_blank" rel="noopener noreferrer" class="footer-link">
                        <i class="bi bi-github"></i> Repositório
                    </a>
                    <a href="https://buymeacoffee.com/leosgarcia" target="_blank" rel="noopener noreferrer" class="footer-link coffee">
                        <i class="bi bi-cup-hot-fill"></i> Apoiar Projeto
                    </a>
                </div>
            </div>
        </footer>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
